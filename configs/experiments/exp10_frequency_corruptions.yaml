experiment_id: "exp10_frequency_corruptions"
description: "Group B best frequency filter (2D-DWT) evaluated on MVTec-AD-C corruptions"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  split_ratio: 0.8
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer: null
  frequency_filter:
    name: "dwt"
    alpha: 0.6
    gamma: 1.4
    wavelet: "haar"

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: true

experiment_id: "exp09_synthesizer_corruptions"
description: "Group A best synthesizer (CutPaste) evaluated on MVTec-AD-C corruptions"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  split_ratio: 0.8
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer:
    name: "cutpaste"
    mode: "scar"
    patch_ratio: [0.02, 0.15]
    color_jitter: 0.1
  frequency_filter: null

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: true

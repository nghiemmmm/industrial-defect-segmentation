experiment_id: "exp06_cutpaste_fft"
description: "YOLOv11-seg combining CutPaste synthesis with FFT periodic suppression"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  split_ratio: 0.8
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer:
    type: "cutpaste"
    mode: "union"
    anomaly_prob: 0.85
  frequency_filter:
    type: "fft"
    tau: 3.5
    notch_sigma: 3.5

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: false

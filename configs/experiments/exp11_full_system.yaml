experiment_id: "exp11_full_system"
description: "Full research system: CutPaste + DWT + MVTec-AD-C robustness evaluation"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  split_ratio: 0.8
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer:
    type: "cutpaste"
    mode: "union"
    anomaly_prob: 0.85
  frequency_filter:
    type: "dwt"
    alpha: 0.5
    gamma: 1.6
    wavelet: "haar"

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: true

experiment_id: "exp05_dwt"
description: "YOLOv11-seg with 2D-DWT sub-band detail enhancement"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  split_ratio: 0.8
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer: null
  frequency_filter:
    type: "dwt"
    alpha: 0.5
    gamma: 1.6
    wavelet: "haar"

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: false

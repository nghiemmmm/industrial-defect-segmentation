experiment_id: "exp02_draem"
description: "Canonical-grid DRAEM Perlin synthesis with negative-sample invariant (rho_neg = 0.15)"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  defect_free: true
  split_ratio: 0.85
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer:
    type: "draem"
    perlin_threshold: 0.45
    beta_range: [0.2, 0.8]
    anomaly_prob: 0.85
  frequency_filter: null

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: false

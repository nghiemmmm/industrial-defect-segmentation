experiment_id: "exp04_fft"
description: "YOLOv11-seg with FAIR 2D-FFT periodic pattern suppression"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  split_ratio: 0.8
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer: null
  frequency_filter:
    type: "fft"
    tau: 3.5
    notch_sigma: 3.5

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: false

experiment_id: "exp05_cutpaste_dwt"
description: "CutPaste (Base) + Haar 2D-DWT sub-band detail boost (rho_neg = 0.15) + MVTec-AD-C evaluation"

dataset:
  name: "mvtec"
  root_dir: "./mvtec_ad"
  target_categories: ["grid", "carpet", "tile", "screw", "pill", "bottle"]
  defect_free: true
  split_ratio: 0.85
  good_ratio: 0.15
  seed: 42

data_engine:
  synthesizer:
    type: "cutpaste"
    mode: "union"
    anomaly_prob: 0.85
  frequency_filter:
    type: "dwt"
    alpha: 0.5
    gamma: 1.6
    wavelet: "haar"

model:
  weights: "yolo11l-seg.pt"
  imgsz: 640
  epochs: 100
  batch: 16
  device: "auto"

evaluation:
  dual_domain: true
  robustness_benchmark: true
